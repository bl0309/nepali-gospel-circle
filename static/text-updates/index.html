<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Text Updates · Nepali Gospel Circle</title><link rel="stylesheet" href="/css/admin.css"></head><body><main class="signup"><a href="/">← Nepali Gospel Circle</a><h1>Church text updates</h1><p>Join our church announcements and reminders by text.</p><form id="signup-form"><label>First name <input name="first_name" required maxlength="100" autocomplete="given-name"></label><label>Last name <input name="last_name" maxlength="100" autocomplete="family-name"></label><label>Mobile phone <input name="phone" required type="tel" autocomplete="tel" inputmode="tel"></label><label>Email (optional) <input name="email" type="email" autocomplete="email"></label><label class="trap" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label><label class="check"><input name="consent" type="checkbox" required> <span>By checking this box, I agree to receive recurring church announcements, event reminders, prayer and fellowship updates, and ministry related text messages from Nepali Gospel Circle. Message frequency varies. Message and data rates may apply. Reply STOP to unsubscribe and HELP for help.</span></label><button type="submit">Send confirmation code</button></form><form id="verify-form" hidden><h2>Confirm your phone</h2><label>Six-digit code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><div class="actions"><button type="submit">Confirm signup</button><button type="button" class="secondary" id="restart-signup">Start again</button></div></form><p id="result" role="status"></p></main><script src="/js/signup.js" defer></script></body></html>
